<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sherlock Console</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#14171f;--mut:#667085;--line:#e3e6ec;--acc:#2f5bea;--acc-fg:#fff;
--ok:#0f8a5f;--okbg:#e2f6ee;--warn:#a15c00;--warnbg:#fff1d6;--bad:#b42318;--badbg:#fde7e4;--low:#5b6478;--lowbg:#eceef3;--med:#7a4dd8;--medbg:#efe8fd}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--fg:#e8ebf1;--mut:#8b93a5;--line:#2a303b;--acc:#6f8cff;--acc-fg:#0e1116;
--ok:#4cd6a0;--okbg:#12342a;--warn:#f0b04a;--warnbg:#3a2c10;--bad:#ff8a7d;--badbg:#3a1a17;--low:#a4acbd;--lowbg:#252b36;--med:#b79bff;--medbg:#2a2144}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
header{display:flex;align-items:baseline;gap:12px;margin:8px 0 16px}
h1{font-size:20px;margin:0}
.sub{color:var(--mut);font-size:12.5px}
.grid{display:grid;grid-template-columns:260px 1fr;gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 10px}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.seg button{flex:1;min-width:80px;padding:7px 10px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;cursor:pointer;font:inherit}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.row{display:flex;gap:8px}
input[type=text],input[type=number],textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
button.primary{padding:9px 16px;border:0;border-radius:8px;background:var(--acc);color:var(--acc-fg);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
button.primary:disabled{opacity:.5;cursor:default}
button.ghost{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);font:inherit;cursor:pointer}
details{margin-top:10px}summary{cursor:pointer;color:var(--mut)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}
.opts label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.opts label.chk{flex-direction:row;align-items:center;gap:6px;color:var(--fg)}
.hint{font-size:12px;color:var(--mut);margin-top:8px}
.err{color:var(--bad);margin-top:8px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hist li{padding:8px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.hist li.sel{border-color:var(--acc)}
.hist .v{font-weight:600;word-break:break-all}.hist .m{font-size:12px;color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card)}
.tile .n{font-size:22px;font-weight:700}.tile .l{font-size:12px;color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0}
.bar>div{height:100%;background:var(--acc);width:0;transition:width .3s}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:12px 0 10px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;color:var(--mut);padding:8px 12px;font:inherit;cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--fg);border-color:var(--acc);font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools input[type=text]{max-width:260px}
.chip{padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;font:inherit;font-size:12px}
.chip[aria-pressed=true]{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--card);cursor:pointer;user-select:none;font-size:12px;color:var(--mut);white-space:nowrap}
tr:last-child td{border-bottom:0}
a{color:var(--acc);word-break:break-all}
.b{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600}
.b.direct,.b.high{background:var(--okbg);color:var(--ok)}
.b.medium{background:var(--medbg);color:var(--med)}
.b.low{background:var(--lowbg);color:var(--low)}
.b.Claimed{background:var(--okbg);color:var(--ok)}
.b.Available{background:var(--lowbg);color:var(--low)}
.b.Unknown,.b.WAF{background:var(--warnbg);color:var(--warn)}
.b.Illegal{background:var(--badbg);color:var(--bad)}
.note{background:var(--warnbg);color:var(--warn);padding:8px 10px;border-radius:8px;font-size:12.5px;margin:10px 0}
.empty{padding:24px;text-align:center;color:var(--mut)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px}.kv dt{color:var(--mut)}.kv dd{margin:0;word-break:break-word}
ul.pv{margin:4px 0 0;padding-left:18px}
code{background:var(--lowbg);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Sherlock Console</h1><span class="sub">Username engine · email / name / phone (CA) via derived candidates · results are leads, not proof</span></header>
<div class="grid">
  <aside>
    <div class="card"><h2>Session history</h2><ul class="hist" id="hist"></ul><div class="hint" id="histEmpty">No searches yet.</div></div>
  </aside>
  <main>
    <div class="card">
      <div class="seg" id="kinds" role="group" aria-label="Input type"></div>
      <form class="row" id="form"><input type="text" id="value" autocomplete="off" spellcheck="false" aria-label="Search value"><button class="primary" id="go">Search</button></form>
      <div class="hint" id="kindHint"></div><div class="err" id="err" role="alert"></div>
      <details><summary>Options</summary>
        <div class="opts">
          <label>Timeout (s)<input type="number" id="o_timeout" value="30" min="1" max="120"></label>
          <label>Proxy (e.g. socks5://127.0.0.1:9050)<input type="text" id="o_proxy"></label>
          <label>Only these sites (comma separated)<input type="text" id="o_sites" placeholder="all sites"></label>
          <label>Max name variants<input type="number" id="o_max" value="12" min="1" max="30"></label>
          <label class="chk"><input type="checkbox" id="o_nsfw">Include NSFW sites</label>
          <label class="chk"><input type="checkbox" id="o_grav" checked>Gravatar check (email)</label>
          <label class="chk"><input type="checkbox" id="o_remote">Live site manifest</label>
        </div>
      </details>
    </div>
    <div id="out"></div>
  </main>
</div>
</div>
<script>
const KINDS={
 username:{label:"Username",ph:"jdoe   ({?} expands to _ - .)",hint:"Exact username, checked as-is."},
 email:{label:"Email",ph:"jane.doe@gmail.com",hint:"Local-part variants + Gravatar hash match (high confidence)."},
 name:{label:"Full name",ph:"Jane Doe",hint:"Guessed username variants. Common names give many false positives."},
 phone:{label:"Phone (CA)",ph:"(403) 555-0123",hint:"Validates NANP/E.164, flags Alberta codes. Sherlock cannot confirm phone ownership."}
};
const $=id=>document.getElementById(id);
let kind="username",cur=null,timer=null,tab="hits",sortKey="site",sortDir=1,filterText="",confF=new Set(),poll=null;
function el(t,props,...kids){const e=document.createElement(t);for(const[k,v]of Object.entries(props||{})){if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}for(const c of kids)if(c!=null)e.append(c);return e}
function badge(txt){return el("span",{class:"b "+txt,text:txt})}
function buildKinds(){const k=$("kinds");k.replaceChildren();for(const[key,v]of Object.entries(KINDS)){k.append(el("button",{type:"button","aria-pressed":String(key===kind),text:v.label,onclick:()=>{kind=key;buildKinds()}}))}$("value").placeholder=KINDS[kind].ph;$("kindHint").textContent=KINDS[kind].hint}
buildKinds();
function opts(){return{timeout:$("o_timeout").value,proxy:$("o_proxy").value,sites:$("o_sites").value,max_variants:$("o_max").value,nsfw:$("o_nsfw").checked,gravatar:$("o_grav").checked,remote:$("o_remote").checked}}
$("form").addEventListener("submit",async e=>{e.preventDefault();$("err").textContent="";const value=$("value").value.trim();if(!value)return;$("go").disabled=true;
 try{const r=await fetch("/api/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind,value,options:opts()})});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);select(j.id)}catch(x){$("err").textContent=x.message}finally{$("go").disabled=false}});
function select(id){cur=id;tab="hits";confF.clear();filterText="";refresh();clearInterval(poll);poll=setInterval(refresh,800)}
async function refresh(){if(!cur)return;try{const j=await(await fetch("/api/jobs/"+cur)).json();render(j);if(j.status!=="running")clearInterval(poll);loadHist()}catch(e){}}
async function loadHist(){try{const l=await(await fetch("/api/jobs")).json();const h=$("hist");h.replaceChildren();$("histEmpty").style.display=l.length?"none":"block";for(const j of l){h.append(el("li",{class:j.id===cur?"sel":"",onclick:()=>select(j.id)},el("div",{class:"v",text:j.value}),el("div",{class:"m",text:`${KINDS[j.kind].label} · ${j.status} · ${j.hits} hit(s)`})))}}catch(e){}}
loadHist();
function fmtT(s){return s==null?"":s.toFixed(2)+"s"}
function render(j){
 const out=$("out");const fa=document.activeElement&&document.activeElement.id==="flt"?document.activeElement.selectionStart:null;out.replaceChildren();
 const hits=j.rows.filter(r=>r.status==="Claimed");
 const pct=j.total?Math.round(j.done/j.total*100):0;
 out.append(el("div",{class:"tiles"},
  tile(j.status==="running"?`${j.done}/${j.total}`:j.status,"Status"),tile(hits.length,"Hits"),tile(j.candidates.length,"Candidates"),tile(j.sites,"Sites / candidate"),tile(j.elapsed+"s","Elapsed")));
 if(j.status==="running")out.append(el("div",{class:"bar"},el("div",{style:`width:${pct}%`})),el("div",{class:"hint",text:"Checking candidates… you can leave this page open."}),el("button",{class:"ghost",text:"Cancel",onclick:()=>fetch(`/api/jobs/${j.id}/cancel`,{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})}));
 if(j.error)out.append(el("div",{class:"err",text:j.error}));
 out.append(el("div",{class:"note",text:j.method}));
 const tabs=el("div",{class:"tabs",role:"tablist"});
 for(const[k,l]of[["hits",`Hits (${hits.length})`],["all",`All checks (${j.rows.length})`],["cands",`Candidates (${j.candidates.length})`],["info","Details"]])
  tabs.append(el("button",{role:"tab","aria-selected":String(tab===k),text:l,onclick:()=>{tab=k;render(j)}}));
 out.append(tabs);
 if(tab==="hits")out.append(table(j,hits,true));else if(tab==="all")out.append(table(j,j.rows,false));else if(tab==="cands")out.append(cands(j));else out.append(info(j));
}
function tile(n,l){return el("div",{class:"tile"},el("div",{class:"n",text:String(n)}),el("div",{class:"l",text:l}))}
function table(j,rows,hitsOnly){
 const wrap=el("div");
 const tools=el("div",{class:"tools"});
 const f=el("input",{type:"text",id:"flt",placeholder:"Filter site / candidate / url",value:filterText});
 f.addEventListener("input",()=>{filterText=f.value;drawBody()});
 tools.append(f);
 for(const c of["direct","high","medium","low"])if(rows.some(r=>r.confidence===c))tools.append(el("button",{class:"chip","aria-pressed":String(confF.has(c)),text:c,onclick:e=>{confF.has(c)?confF.delete(c):confF.add(c);e.target.setAttribute("aria-pressed",String(confF.has(c)));drawBody()}}));
 tools.append(el("span",{style:"flex:1"}),el("button",{class:"ghost",text:"Export CSV",onclick:()=>exportCSV(j,visible())}),el("button",{class:"ghost",text:"Export JSON",onclick:()=>dl(`sherlock_${j.kind}_${j.id}.json`,JSON.stringify(j,null,2),"application/json")}));
 wrap.append(tools);
 const cols=[["site","Site"],["candidate","Candidate"],["confidence","Confidence"],...(hitsOnly?[]:[["status","Status"]]),["url","URL"],["http_status","HTTP"],["response_time_s","Time"]];
 const tw=el("div",{class:"tw"}),t=el("table"),thead=el("thead"),tr=el("tr");
 for(const[k,l]of cols)tr.append(el("th",{text:l+(sortKey===k?(sortDir>0?" ▲":" ▼"):""),onclick:()=>{sortDir=sortKey===k?-sortDir:1;sortKey=k;drawBody()}}));
 thead.append(tr);const tb=el("tbody");t.append(thead,tb);tw.append(t);wrap.append(tw);
 function visible(){const q=filterText.toLowerCase();return rows.filter(r=>(!confF.size||confF.has(r.confidence))&&(!q||(r.site+" "+r.candidate+" "+r.url).toLowerCase().includes(q))).sort((a,b)=>{const x=a[sortKey],y=b[sortKey];return(x==null?1:y==null?-1:x<y?-1:x>y?1:0)*sortDir})}
 function drawBody(){const v=visible();tb.replaceChildren();if(!v.length){tb.append(el("tr",{},el("td",{colspan:cols.length,class:"empty",text:rows.length?"No rows match the filter.":(hitsOnly?"No hits found (yet).":"No data yet.")})));return}
  for(const r of v){const tr=el("tr");for(const[k]of cols){const td=el("td");
   if(k==="confidence"||k==="status")td.append(badge(r[k]));
   else if(k==="url"){if(/^https?:\/\//i.test(r.url||""))td.append(el("a",{href:r.url,target:"_blank",rel:"noopener noreferrer",text:r.url}));else td.textContent=r.url||""}
   else if(k==="response_time_s")td.textContent=fmtT(r[k]);else td.textContent=r[k]==null?"":r[k];
   tr.append(td)}tb.append(tr)}}
 drawBody();return wrap}
function cands(j){const tw=el("div",{class:"tw"}),t=el("table");t.append(el("thead",{},el("tr",{},...["Candidate","Confidence","Checked","Hits"].map(x=>el("th",{text:x})))));const tb=el("tbody");for(const c of j.candidates)tb.append(el("tr",{},el("td",{text:c.candidate}),el("td",{},badge(c.confidence)),el("td",{text:c.checked?"yes":"pending"}),el("td",{text:String(c.hits)})));t.append(tb);tw.append(t);return tw}
function info(j){const dl=el("dl",{class:"kv"});const add=(k,v)=>{dl.append(el("dt",{text:k}),v instanceof Node?el("dd",{},v):el("dd",{text:String(v)}))};
 add("Input",`${KINDS[j.kind].label}: ${j.value}`);add("Status",j.status);
 const st={};for(const r of j.rows)st[r.status]=(st[r.status]||0)+1;add("Check outcomes",Object.entries(st).map(([k,v])=>`${k}: ${v}`).join(" · ")||"—");
 for(const[k,v]of Object.entries(j.extras)){if(Array.isArray(v)){const ul=el("ul",{class:"pv"});v.forEach(x=>ul.append(el("li",{text:x})));add(k,ul)}else if(/^https?:/.test(v))add(k,el("a",{href:v,target:"_blank",rel:"noopener noreferrer",text:v}));else add(k,v)}
 if(j.saved_to)add("Saved to",el("code",{text:j.saved_to}));
 return el("div",{class:"card"},dl)}
function dl(name,text,type){const a=el("a",{href:URL.createObjectURL(new Blob([text],{type})),download:name});document.body.append(a);a.click();a.remove()}
function exportCSV(j,rows){const cols=["candidate","confidence","site","url","status","http_status","response_time_s"];const q=v=>{v=v==null?"":String(v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
 dl(`sherlock_${j.kind}_${j.id}.csv`,[cols.join(","),...rows.map(r=>cols.map(c=>q(r[c])).join(","))].join("\n"),"text/csv")}
</script>
</body>
</html>
